[project]
name = "agent-engine"
version = "0.1.0"
description = "Deterministic repository analyzer and AI DevOps configuration engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.5",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.40",
    "pydantic>=2.10.0",
    "pynacl>=1.5.0",
    "pytest>=8.3.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
